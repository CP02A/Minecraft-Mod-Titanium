plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    implementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}")
    // Titanium uses the javax.annotation annotations, which Minecraft doesn't expose on Fabric
    compileOnly('com.google.code.findbugs:jsr305:3.0.2')

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}

loom {
    def aw = rootProject.file("common/src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    // Groups the classes and resources of the mod in dev, so the mod root paths contain both
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        // Boots a server, runs the game tests (if any) and exits; used as a loading smoke test
        gametest {
            server()
            setConfigName('Fabric Game Test Server')
            vmArg('-Dfabric-api.gametest')
            runDir('runs/gametest')
        }
    }
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.env['CURSE_API']

    def mainFile = upload(287342, jar)
    mainFile.releaseType = 'beta'
    mainFile.changelog = 'https://github.com/InnovativeOnlineIndustries/Titanium/blob/26.3/CHANGELOG.md'
    mainFile.changelogType = 'markdown'
    mainFile.addModLoader('Fabric')
    mainFile.addGameVersion(minecraft_version)
    mainFile.addEnvironment('Client', 'Server')
    mainFile.addRequirement('fabric-api')
    mainFile.addRequirement('forge-config-api-port-fabric')
}

tasks.modrinth.enabled = System.env['MODRINTH_TOKEN'] != null

modrinth {
    token = System.getenv('MODRINTH_TOKEN')
    projectId = '1Ro7m06l'
    versionType = 'beta'
    uploadFile = jar
    gameVersions = [minecraft_version]
    loaders = ['fabric']
    dependencies {
        required.project 'fabric-api'
        required.project 'forge-config-api-port'
    }
    changelog = 'https://github.com/InnovativeOnlineIndustries/Titanium/blob/26.3/CHANGELOG.md'
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
